<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>一念成笺 · 国风诗签</title>
  <meta name="description" content="把此刻心情，化成一张可收藏、可分享、可同题挑战的国风诗签。" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="a11yStatus" class="sr-only" aria-live="polite"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <header class="hero">
    <div class="hero-mark" aria-hidden="true">一念成笺</div>
    <p class="hero-kicker">国风诗签 · 今日落墨</p>
    <h1>一念成笺</h1>
    <p class="sub">把此刻心情，化成一张可收藏、可分享、可同题挑战的国风诗签。</p>
    <div class="steps-guide" aria-label="创作流程">
      <span class="step-item"><b>01</b> 选心境</span>
      <span class="step-arrow" aria-hidden="true">—</span>
      <span class="step-item"><b>02</b> 成诗签</span>
      <span class="step-arrow" aria-hidden="true">—</span>
      <span class="step-item"><b>03</b> 分享同题</span>
    </div>
  </header>

  <main class="grid">
    <section class="card ctrl" aria-labelledby="ctrlTitle">
      <div class="section-eyebrow">今日落墨 · 01</div>
      <h2 id="ctrlTitle" class="card-title">选一念，成一笺</h2>

      <div class="field-block mood-field">
        <div class="field-heading">
          <span class="field-label">心境关键词</span>
          <span class="field-hint">1—4 个汉字</span>
        </div>
        <div class="mood-chips" id="moodChips" role="group" aria-label="心境快捷选择">
          <button type="button" class="chip" data-mood="清欢" aria-pressed="false">清欢</button>
          <button type="button" class="chip" data-mood="思念" aria-pressed="false">思念</button>
          <button type="button" class="chip" data-mood="孤勇" aria-pressed="false">孤勇</button>
          <button type="button" class="chip" data-mood="松弛" aria-pressed="false">松弛</button>
          <button type="button" class="chip" data-mood="期许" aria-pressed="false">期许</button>
          <button type="button" class="chip" data-mood="释然" aria-pressed="false">释然</button>
          <button type="button" class="chip" data-mood="怦然" aria-pressed="false">怦然</button>
          <button type="button" class="chip" data-mood="归心" aria-pressed="false">归心</button>
          <button type="button" class="chip" data-mood="远行" aria-pressed="false">远行</button>
        </div>
        <label class="text-input-wrap" for="mood">
          <span class="sr-only">自定义心境关键词</span>
          <input id="mood" type="text" inputmode="text" placeholder="例如：暮雪、清风、寻酒" autocomplete="off" />
        </label>
      </div>

      <div class="form-grid">
        <label class="row" for="themeCategory">
          <span>意象类别</span>
          <select id="themeCategory">
            <option value="山水">山水</option>
            <option value="节气">节气</option>
            <option value="雅器">雅器</option>
            <option value="志怪">志怪</option>
          </select>
        </label>
        <label class="row" for="theme">
          <span>文化意象</span>
          <select id="theme"></select>
        </label>
        <label class="row" for="cipai">
          <span>诗签字数</span>
          <select id="cipai">
            <option value="7" selected>七言诗签 · 四句</option>
            <option value="5">五言诗签 · 四句</option>
          </select>
        </label>
        <label class="row" for="palette">
          <span>视觉底色</span>
          <select id="palette">
            <option value="cinnabar" selected>宣纸朱砂</option>
            <option value="indigo">黛青月白</option>
            <option value="bamboo">竹青松烟</option>
          </select>
        </label>
      </div>

      <label class="row author-row" for="author">
        <span>落款</span>
        <input id="author" type="text" maxlength="6" inputmode="text" placeholder="默认：无名客" autocomplete="off" />
      </label>

      <button id="go" class="primary generate-btn" type="button">🪶 生成诗签</button>
      <p class="microcopy">所有内容只在本机生成与保存，不上传任何输入。</p>

      <div class="result-divider" aria-hidden="true"><span>✦</span></div>
      <div class="result-heading">
        <div>
          <div class="section-eyebrow">今日落墨 · 02</div>
          <h2 class="card-title">你的诗签</h2>
        </div>
        <span class="paper-title" id="poemTitleBadge">七言诗签</span>
      </div>
      <div class="poem-preview-box">
        <h3 id="poemTitle" class="poem-title">一念成笺</h3>
        <div class="poem" id="poem" role="region" aria-label="生成的四句诗签"></div>
        <p id="interpretation" class="interpretation"></p>
        <p id="source" class="source-note"></p>
      </div>

      <details class="note-details" open>
        <summary>小红书分享文案</summary>
        <textarea id="note" rows="12" readonly aria-label="小红书分享文案内容"></textarea>
      </details>
    </section>

    <section class="card preview" aria-labelledby="previewTitle">
      <div class="section-eyebrow">今日落墨 · 03</div>
      <div class="preview-header">
        <h2 id="previewTitle" class="card-title">诗签成像</h2>
        <span class="preview-tag">3:4 · 1200×1600</span>
      </div>
      <p id="challengeHint" class="challenge-hint hidden"></p>
      <div class="canvas-wrap">
        <canvas id="seal" width="1200" height="1600" aria-label="国风诗签高清预览图"></canvas>
      </div>
      <p class="hint">长按或右键图片即可保存；也可以使用下方操作。</p>
      <div class="result-actions" aria-label="诗签操作">
        <button id="download" class="primary" type="button">保存诗签图</button>
        <button id="reroll" type="button">换一签</button>
        <button id="copyNote" type="button">复制文案</button>
        <button id="invite" class="ghost" type="button">邀请同题</button>
      </div>

      <section id="historyPanel" class="history-panel hidden" aria-labelledby="historyTitle">
        <div class="history-header">
          <h3 id="historyTitle">最近十二签</h3>
          <button id="clearHistory" class="text-button" type="button">清空</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </section>
  </main>

  <footer>
    <p>一念成笺 · 国风诗签</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
